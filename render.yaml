# Render free-tier deployment for the PharmaPro backend.
# Push this repo to GitHub, then in Render: New -> Blueprint -> select the repo.
# Render creates the web service AND the Postgres database and wires
# DATABASE_URL automatically. SESSION_SECRET is generated by Render.
# NOTE: Render's free Postgres expires after 90 days. For a real business,
# upgrade to a paid database (or move to a VPS) before that. Take regular
# pg_dump backups regardless of tier.
services:
  - type: web
    name: pharmapro-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pharmapro-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        value: https://pharmapro-backend.onrender.com

databases:
  - name: pharmapro-db
    plan: free
